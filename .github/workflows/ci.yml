name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests (pytest)
        run: pytest

      - name: Published widget matches widget/ sources
        run: |
          python -m scraper.build_widget
          git diff --exit-code docs/widget.html || {
            echo "::error file=docs/widget.html::docs/widget.html is stale. Run 'python -m scraper.build_widget' and commit it."
            exit 1
          }
