<!doctype html>
<!--
  Local test host for the embed snippet in README.md ("Embedding in the ESB AI
  Studio inventory page"). Serve the repo root (python -m http.server 8765) and
  open http://localhost:8765/widget/embed-test.html. The block between the
  SNIPPET markers must stay identical to the README, except for the iframe src.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed test | ESB inventory widget</title>
    <style>
      body { margin: 0; background: #fcfaf8; color: #2c2421; font-family: ui-sans-serif, system-ui, sans-serif; }
      header, footer { padding: 48px 16px; text-align: center; }
      h1 { margin: 0; font-size: 40px; font-weight: 800; }
      section { background: #fff; padding: 48px 0; }
      .container { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
    </style>
  </head>
  <body>
    <header><h1>What's on the lot right now</h1></header>
    <section>
      <div class="container">
        <!-- SNIPPET START -->
        <iframe
          id="esb-inventory-frame"
          src="../docs/widget.html"
          title="Sheds in stock at Eagle Sheds &amp; Buildings"
          style="display: block; width: 100%; height: 900px; border: 0"
        ></iframe>
        <script>
          (function () {
            var frame = document.getElementById("esb-inventory-frame");
            var origin = new URL(frame.src).origin;
            window.addEventListener("message", function (event) {
              var data = event.data;
              if (event.origin !== origin || !data || data.type !== "esb-inventory:height") return;
              frame.style.height = data.height + "px";
            });
            frame.addEventListener("load", function () {
              frame.contentWindow.postMessage({ type: "esb-inventory:request-height" }, origin);
            });
          })();
        </script>
        <!-- SNIPPET END -->
      </div>
    </section>
    <footer>Page footer: should sit directly below the last shed card.</footer>
  </body>
</html>
